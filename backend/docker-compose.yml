services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend:dev
    container_name: fastapi_app
    environment:
      - DATABASE_URL
      - SECRET_KEY:=long_secret_key_string
      - ALGORITHM:-HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES:-60
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - postgres
  postgres:
    container_name: postgresdb
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass}
      POSTGRES_DB: ${DATABASE:-mydb}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - postgres
    restart: unless-stopped

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
