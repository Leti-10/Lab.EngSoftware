[project]
name = "entregas-lab-engsoftware"
version = "0.1.0"
description = "Backend do projeto BookStore"
readme = "README.md"
authors = [
    { name = "Wesley Xavier", email = "wesley.xvier@gmail.com" },
    { name = "Fabio Nawa", email = "" },
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
pythonpath = ["."]
